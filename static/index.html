<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodacom IA Agent</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header>Vodacom IA Agent</header>
    <div class="chat">
        <div class="greeting">Comment puis-je vous aider ?</div>
        <div class="messages" id="messages"></div>
        <div class="input-wrap">
            <form class="input-bar" id="chat-form">
                <input type="text" name="message" id="user-input" placeholder="Écris un message..." autocomplete="off" required>
                <button type="submit">↑</button>
            </form>
            <div class="hint">Vodacom AI peut faire des erreurs. Vérifiez les infos importantes.</div>
        </div>
    </div>
    <script src="static/app.js"></script>
</body>
</html>
